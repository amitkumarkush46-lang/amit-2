<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Career Recommendation Dashboard</title>
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/sidebar.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="sidebar">
        <h2>Navigation</h2>
        <ul>
            <li><a href="index.html"><i class="fas fa-home"></i> Home</a></li>
            <li><a href="profile-input.html"><i class="fas fa-user-edit"></i> Profile Input</a></li>
            <li><a href="dashboard.html"><i class="fas fa-chart-line"></i> Dashboard</a></li>
            <li><a href="settings.html"><i class="fas fa-cog"></i> Settings</a></li>
        </ul>
    </div>
    <div class="main-content">
        <div class="container">
            <h1>🎉 Your Career Recommendations</h1>
            <p id="userGreeting"></p>
            <div id="recommendations">
                <!-- Recommendations will be displayed here -->
            </div>
            <a href="profile-input.html">Back to Profile Input</a>
        </div>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const loggedInUser = localStorage.getItem('loggedInUser');
            const greeting = document.getElementById('userGreeting');
            if (loggedInUser) {
                greeting.textContent = `Hello ${loggedInUser}, here are your personalized career recommendations!`;
            }
        });
    </script>
    <script src="js/sidebar-logic.js"></script>
    <script src="js/dashboard-charts.js"></script>
</body>
</html>
